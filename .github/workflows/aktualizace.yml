name: Aktualizace přehledu článků

on:
  schedule:
    - cron: "17 4 * * *"     # každý den v 4:17 UTC (5:17 v zimě / 6:17 v létě českého času)
  workflow_dispatch:          # ruční spuštění tlačítkem „Run workflow“

permissions:
  contents: write

concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace knihovny
        run: pip install feedparser

      - name: Široký výběr (7 dní)
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python atmo_news.py --publish docs

      - name: Užší výběr (30 dní)
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python atmo_news.py --publish docs --narrow

      - name: Uložení výsledků
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs archiv_clanku.json videne_clanky.json videne_clanky_uzky.json
          git diff --cached --quiet || git commit -m "Aktualizace přehledu $(date -u +%Y-%m-%d)"
          git push
